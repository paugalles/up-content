name: Upload Poster to TikTok

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 6,17 * * *'

jobs:
  upload-poster-tiktok:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/309306571615/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@project-1493a8e0-d428-41c3-a11.iam.gserviceaccount.com'

      - name: Run Upload Script
        env:
          POSTER_MEDIA_FOLDER: ${{ secrets.POSTER_MEDIA_FOLDER }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          python scripts/up_poster_tiktok.py
