name: Publish LinkedIn and YouTube
on:
  schedule:
    - cron: '0 8,14,20 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-linkedin-youtube
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12', cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env: {DRY_RUN: 'true'}
      - run: python scripts/linkedin_and_youtube.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ARTICLE_BASE_URL: ${{ secrets.ARTICLE_BASE_URL }}
          ARTICLE_SITEMAP_URL_ES: ${{ secrets.ARTICLE_SITEMAP_URL_ES }}
          ARTICLE_SITEMAP_URL_EN: ${{ secrets.ARTICLE_SITEMAP_URL_EN }}
          BRAND_NAME: ${{ secrets.BRAND_NAME }}
          BRAND_SITE: ${{ secrets.BRAND_SITE }}
          BRAND_CTA_ES: ${{ secrets.BRAND_CTA_ES }}
          BRAND_CTA_EN: ${{ secrets.BRAND_CTA_EN }}
